<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Result | ASCEND</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #4f46e5;


    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0c0c0e;
      color: #fff;
      margin: 0;
      display: block;
      min-height: 100vh;
    }

    /* ===== MAIN ===== */
    .main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px; width: 100%;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .accent-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }

    .score-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }

    .score-ring {
      flex: none;
    }

    .score-legend {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-width: 120px;
      text-align: left;
    }

    .score-legend-title {
      color: #64748b;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-legend-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      border-radius: 0.5rem;
      color: #64748b;
      font-size: 0.8rem;
      padding: 0.2rem 0.35rem;
      white-space: nowrap;
    }

    .score-legend-item.active {
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 700;
    }

    .score-legend-swatch {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      flex: none;
    }

    .score-legend-swatch.red { background: #ef4444; }
    .score-legend-swatch.orange { background: #f97316; }
    .score-legend-swatch.yellow { background: #eab308; }
    .score-legend-swatch.green { background: #22c55e; }

    @media (max-width: 640px) {
      .score-display {
        flex-direction: column;
        gap: 1.25rem;
      }

      .score-legend {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        min-width: 0;
        width: 100%;
        max-width: 280px;
      }

      .score-legend-title {
        grid-column: 1 / -1;
      }
    }
  </style>
  <link rel="stylesheet" href="css/app-theme.css">
  <style>
    body.test-result-page .main {
      box-sizing: border-box;
      min-height: calc(100vh - 80px);
      padding: clamp(8px, 2vh, 18px) clamp(12px, 2.4vw, 32px);
    }

    body.test-result-page #result-card {
      padding: clamp(18px, 3vh, 28px);
    }

    body.test-result-page #result-card > .mb-8 {
      margin-bottom: clamp(12px, 2vh, 20px);
    }

    body.test-result-page .score-display {
      gap: clamp(16px, 2vw, 28px);
      margin-bottom: clamp(16px, 2vh, 24px);
    }

    body.test-result-page .score-ring svg {
      width: clamp(136px, 20vh, 168px);
      height: clamp(136px, 20vh, 168px);
    }

    body.test-result-page #result-summary {
      margin-bottom: clamp(16px, 2.2vh, 24px);
    }

    body.test-result-page #result-summary > :not(:first-child) {
      margin-top: 12px;
    }

    body.test-result-page #result-card .grid > button {
      min-height: 48px;
      padding-block: 12px;
    }

    @media (max-width: 640px) {
      body.test-result-page .score-display {
        flex-direction: column;
        gap: 12px;
      }

      body.test-result-page .score-legend {
        gap: 4px;
      }
    }

    @media (max-height: 650px) {
      body.test-result-page .main {
        padding-block: 8px;
      }

      body.test-result-page #result-card {
        padding: 16px 20px;
      }

      body.test-result-page .score-display {
        margin-bottom: 12px;
      }

      body.test-result-page #result-summary {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body class="test-result-page">
<div id="app-navbar"></div>
<main class="main">
    <div id="result-card" class="max-w-xl w-full glass rounded-3xl p-10 shadow-2xl text-center">
      <div class="mb-8">
        <h1 class="text-3xl font-bold mb-2">Assessment Results</h1>
        <p id="test-info" class="text-gray-400 uppercase tracking-widest text-xs font-semibold">DATA STRUCTURES • EASY
        </p>
      </div>

      <div class="score-display">
        <div class="relative score-ring">
          <svg class="w-48 h-48 transform -rotate-90" viewBox="0 0 192 192" role="img" aria-label="Assessment score">
            <circle cx="96" cy="96" r="88" stroke="currentColor" stroke-width="12" fill="transparent"
              class="text-gray-200">
            </circle>
            <circle id="progress-circle" cx="96" cy="96" r="88" stroke="currentColor" stroke-width="12"
              fill="transparent" stroke-dasharray="552.92" stroke-dashoffset="552.92"
              class="text-indigo-500 transition-all duration-1000 ease-out"></circle>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="score-text" class="text-5xl font-bold">0</span>
            <span id="max-score" class="text-gray-500 text-sm font-medium">/ 60</span>
          </div>
        </div>
        <div id="score-legend" class="score-legend" aria-label="Score ranges">
          <span class="score-legend-title">Score range</span>
          <div class="score-legend-item" data-band="red">
            <span class="score-legend-swatch red" aria-hidden="true"></span>
            <span data-range>0-15</span>
          </div>
          <div class="score-legend-item" data-band="orange">
            <span class="score-legend-swatch orange" aria-hidden="true"></span>
            <span data-range>16-30</span>
          </div>
          <div class="score-legend-item" data-band="yellow">
            <span class="score-legend-swatch yellow" aria-hidden="true"></span>
            <span data-range>31-45</span>
          </div>
          <div class="score-legend-item" data-band="green">
            <span class="score-legend-swatch green" aria-hidden="true"></span>
            <span data-range>46-60</span>
          </div>
        </div>
      </div>

      <div id="result-summary" class="space-y-6 mb-10">
        <div>
          <h2 id="label-text" class="text-2xl font-bold text-indigo-400">Loading...</h2>
          <p id="accuracy-text" class="text-sm text-gray-500 mt-1">Accuracy: 0%</p>
        </div>
        <p id="feedback-text" class="text-gray-300 leading-relaxed max-w-sm mx-auto">
          Please wait while we fetch your results.
        </p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <button onclick="retryTechnicalTest()"
          class="bg-white/5 hover:bg-white/10 text-white font-bold py-4 rounded-xl transition-all">
          Try again
        </button>
        <button onclick="window.location.href='technical_test_setup.html'"
          class="accent-gradient hover:opacity-90 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
          Exit Test
        </button>
      </div>
    </div>
  </main>

  <script src="js/userContext.js"></script>
  <script>
    function retryTechnicalTest() {
      if (!sessionStorage.getItem('testConfig')) {
        window.location.href = 'technical_test_setup.html';
        return;
      }
      sessionStorage.removeItem('lastTestId');
      window.location.href = 'technical_test_session.html';
    }

    async function fetchResult() {
      const testId = sessionStorage.getItem('lastTestId');
      if (!testId) {
        window.location.href = 'technical_test_setup.html';
        return;
      }

      try {
        const res = await fetch(`/api/test/result/${testId}`);
        const data = await res.json();

        if (data.success) {
          const r = data.data;
          sessionStorage.setItem('testConfig', JSON.stringify({
            subject: r.subject,
            difficulty: r.difficulty
          }));
          const score = Number(r.score);
          const maxScore = Number(r.maxScore);
          const scorePercent = Math.max(0, Math.min(100, (score / maxScore) * 100));
          const bands = [
            { id: 'red', color: '#ef4444', maxPercent: 25 },
            { id: 'orange', color: '#f97316', maxPercent: 50 },
            { id: 'yellow', color: '#eab308', maxPercent: 75 },
            { id: 'green', color: '#22c55e', maxPercent: 100 }
          ];
          const activeBand = bands.find(band => scorePercent <= band.maxPercent) || bands[bands.length - 1];
          const boundaries = [0.25, 0.5, 0.75].map(percent => Math.floor(maxScore * percent));
          const ranges = [
            `0-${boundaries[0]}`,
            `${boundaries[0] + 1}-${boundaries[1]}`,
            `${boundaries[1] + 1}-${boundaries[2]}`,
            `${boundaries[2] + 1}-${maxScore}`
          ];

          document.getElementById('test-info').textContent = `${r.subject.replace('-', ' ')} • ${r.difficulty}`;
          document.getElementById('score-text').textContent = r.score;
          document.getElementById('max-score').textContent = `/ ${r.maxScore}`;
          document.getElementById('accuracy-text').textContent = `Accuracy: ${r.accuracy}%`;
          document.getElementById('label-text').textContent = r.label;
          document.getElementById('feedback-text').textContent = r.feedback;

          const circle = document.getElementById('progress-circle');
          const circumference = 552.92;
          const offset = circumference - (scorePercent / 100) * circumference;
          circle.style.stroke = activeBand.color;

          document.querySelectorAll('.score-legend-item').forEach((item, index) => {
            item.querySelector('[data-range]').textContent = ranges[index];
            item.classList.toggle('active', item.dataset.band === activeBand.id);
            if (item.dataset.band === activeBand.id) {
              item.setAttribute('aria-current', 'true');
            } else {
              item.removeAttribute('aria-current');
            }
          });

          setTimeout(() => {
            circle.style.strokeDashoffset = offset;
          }, 100);
        }
      } catch (e) {
        console.error(e);
      }
    }
    fetchResult();
  </script>
  <script src="js/navbar.js"></script>
</body>

</html>
